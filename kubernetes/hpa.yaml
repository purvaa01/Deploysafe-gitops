apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deploysafe-rollout
  namespace: deploysafe

spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: deploysafe-rollout

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50